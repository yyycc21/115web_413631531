<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 設定瀏覽器分頁標題 -->
  <title>我的個人網站</title>
  <style>
    /* 新增的 CSS 排版設定 */
    .concert-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 設定為兩欄（一排兩張） */
      gap: 0px; /* 設定照片之間的間距 */
    }

    .concert-item {
      text-align: center; /* 讓圖片、影片與文字置中 */
    }

    /* 確保圖片與影片都不會超出外框 */
    .concert-item img,
    .concert-item video,
    .concert-item iframe {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <!-- header：網頁的頁首區域 -->
  <header>
    <!-- h1：網頁最主要的標題 -->
    <h1>我的個人網站</h1>

    <!-- nav：放置網頁導覽連結 -->
    <nav>
      <!-- 連結到目前的首頁 -->
      <a href="index.html">首頁</a>

      <!-- 連結到同一個資料夾中的 about.html -->
      <a href="about.html">關於我</a>

      <!-- 連結到外部網站 -->
      <!-- target="_blank" 代表在新分頁開啟 -->
      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- main：網頁的主要內容 -->
  <main>

    <!-- section：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>

      <!-- 插入圖片 -->
      <!-- src：圖片檔案的位置 -->
      <!-- alt：圖片無法顯示時的替代文字 -->
      <!-- width：設定圖片寬度 -->
      <img
        src="C:\Projects\115web_413631531\images\螢幕擷取畫面 2026-09-29 143945.png"
        alt="我的個人照片"
        width="200"
      >

      <!-- p：建立段落 -->
      <p>
        大家好，我是淡江資管3C羅翊宸，
        學號是413631531。
      </p>

      <!-- strong：表示重要或需要強調的文字 -->
      <!-- em：表示語氣上的強調文字 -->
    </section>

    <!-- section：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>

      <!-- ul：建立無序清單 -->
      <ul>
        <!-- li：清單中的一個項目 -->
        <li>打球</li>
        <li>看演唱會</li>
        <li>聽音樂</li>
      </ul>
    </section>

    <!-- section：最喜歡的偶像區域 -->
    <section>
      <h2>My Favorite idol</h2>
      <div class="concert-gallery">

        <!-- 放圖片和文字 -->
        <div class="concert-item">
          <img
            src="C:\Projects\115web_413631531\images\S__15056905.jpg"
            alt="H2Hjiwoo"
            width="300"
          >
          <br>
          <h3>Hearts2Hearts-Jiwoo</h3>
        </div>

        <div class="concert-item">
          <video
            src="C:\Projects\115web_413631531\images\812480956.072510.mp4"
            width="250"
            controls
          ></video>
          <h3>20260629-Busan</h3>
        </div>

      </div>
    </section>

    <!-- div：一般區塊容器，本身沒有特殊語意 -->
    <div>
      <h2>更多資訊</h2>

      <!-- 插入連結到 about.html -->
      <p>
        <a href="about.html">查看完整自我介紹</a>
      </p>
    </div>

  </main>

  <!-- footer：網頁的頁尾區域 -->
  <footer>
    <p>© 2026 我的個人網站</p>
  </footer>
</body>

</html>
